
[functions.translate]
enabled = true
verify_jwt = false
import_map = "./functions/translate/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/translate/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/translate/*.html" ]

[functions.ai-services]
enabled = true
verify_jwt = false
import_map = "./functions/ai-services/deno.json"
entrypoint = "./functions/ai-services/index.ts"

